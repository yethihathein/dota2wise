      const { useState, useEffect, useMemo, useCallback, useRef, createContext, useContext } = React;

      // ==================== Lightweight Hash Router Polyfill for Standalone Browser Mode ====================
      const RouterContext = createContext({ path: '/', search: '', navigate: () => {} });

      function Router({ children }) {
        const parseHash = () => {
          const raw = window.location.hash.replace(/^#/, '') || '/';
          const [pathname, searchPart] = raw.split('?');
          return { path: pathname || '/', search: searchPart ? `?${searchPart}` : '' };
        };
        const [loc, setLoc] = useState(parseHash);

        useEffect(() => {
          const onHashChange = () => {
            setLoc(parseHash());
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
          window.addEventListener('hashchange', onHashChange);
          return () => window.removeEventListener('hashchange', onHashChange);
        }, []);

        const navigate = useCallback((to) => {
          window.location.hash = to;
        }, []);

        return (
          <RouterContext.Provider value={{ ...loc, navigate }}>
            {children}
          </RouterContext.Provider>
        );
      }

      function useNavigate() {
        return useContext(RouterContext).navigate;
      }

      function useSearchParams() {
        const { path, search, navigate } = useContext(RouterContext);
        const params = useMemo(() => new URLSearchParams(search), [search]);
        const setSearchParams = useCallback(
          (obj) => {
            const next = new URLSearchParams(obj).toString();
            navigate(next ? `${path}?${next}` : path);
          },
          [path, navigate]
        );
        return [params, setSearchParams];
      }

      function Link({ to, className = '', children, onClick, ...rest }) {
        return (
          <a
            href={`#${to}`}
            onClick={(e) => {
              if (onClick) onClick(e);
            }}
            className={className}
            {...rest}
          >
            {children}
          </a>
        );
      }

      function NavLink({ to, end, className, children, onClick, ...rest }) {
        const { path } = useContext(RouterContext);
        const isActive = end ? path === to : path === to || path.startsWith(to + '/');
        const resolvedClass = typeof className === 'function' ? className({ isActive }) : className;
        return (
          <a
            href={`#${to}`}
            onClick={onClick}
            className={resolvedClass}
            {...rest}
          >
            {children}
          </a>
        );
      }

      function Routes({ children }) {
        const { path } = useContext(RouterContext);
        const childArray = React.Children.toArray(children);
        const matched = childArray.find((c) => c.props.path === path) || childArray[0];
        return matched ? matched.props.element : null;
      }

// ==================== src/services/opendota.js ====================

const OPENDOTA_BASE = 'https://api.opendota.com/api/constants';
const CACHE_KEY = 'dota2_dark_archive_opendota_cache_v1';
const CACHE_TTL_MS = 1000 * 60 * 60 * 12; // 12 hours

const ATTR_MAP = {
  str: 'Strength',
  agi: 'Agility',
  int: 'Intelligence',
  all: 'Universal',
};

async function fetchAndMergeOpenDotaData() {
  // Check localStorage cache first
  try {
    const rawCache = localStorage.getItem(CACHE_KEY);
    if (rawCache) {
      const parsed = JSON.parse(rawCache);
      if (parsed && parsed.timestamp && Date.now() - parsed.timestamp < CACHE_TTL_MS) {
        return {
          heroes: parsed.heroes,
          items: parsed.items,
          source: 'OpenDota API (Cached)',
          error: null,
        };
      }
    }
  } catch (e) {
    // Ignore storage parse error
  }

  try {
    const [heroesRes, itemsRes, heroLoreRes] = await Promise.all([
      fetch(`${OPENDOTA_BASE}/heroes`),
      fetch(`${OPENDOTA_BASE}/items`),
      fetch(`${OPENDOTA_BASE}/hero_lore`),
    ]);

    if (!heroesRes.ok || !itemsRes.ok) {
      throw new Error('OpenDota API returned non-200 status');
    }

    const [rawHeroes, rawItems, rawHeroLore] = await Promise.all([
      heroesRes.json(),
      itemsRes.json(),
      heroLoreRes.ok ? heroLoreRes.json() : Promise.resolve({}),
    ]);

    const mergedHeroes = mergeHeroes(rawHeroes, rawHeroLore);
    const mergedItems = mergeItems(rawItems);

    try {
      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify({
          timestamp: Date.now(),
          heroes: mergedHeroes,
          items: mergedItems,
        })
      );
    } catch (storageErr) {
      // Quota exceeded or private mode; safe to ignore
    }

    return {
      heroes: mergedHeroes,
      items: mergedItems,
      source: 'OpenDota Live API + Curated Lore',
      error: null,
    };
  } catch (err) {
    return {
      heroes: CURATED_HEROES,
      items: CURATED_ITEMS,
      source: 'Curated Archive Fallback',
      error: err.message || 'Using offline curated dataset',
    };
  }
}

function mergeHeroes(rawHeroes, rawHeroLore) {
  const curatedByShort = new Map();
  CURATED_HEROES.forEach((h) => {
    curatedByShort.set(h.shortName, h);
    curatedByShort.set(h.id, h);
  });

  const result = [...CURATED_HEROES];
  const existingShortNames = new Set(CURATED_HEROES.map((h) => h.shortName));

  Object.values(rawHeroes || {}).forEach((h) => {
    const shortName = (h.name || '').replace('npc_dota_hero_', '');
    if (!shortName) return;

    const loreBio = rawHeroLore?.[shortName] || '';

    if (existingShortNames.has(shortName)) {
      const idx = result.findIndex((item) => item.shortName === shortName);
      if (idx !== -1 && loreBio && !result[idx].lore.biography) {
        result[idx].lore.biography = loreBio;
      }
      return;
    }

    const attr = h.primary_attr || 'all';
    const baseStr = h.base_str || 20;
    const baseAgi = h.base_agi || 20;
    const baseInt = h.base_int || 20;

    result.push({
      id: shortName,
      opendotaId: h.id,
      npcName: h.name,
      shortName,
      name: h.localized_name || shortName,
      realName: h.localized_name || shortName,
      title: `${(h.roles || ['Hero'])[0]} of the Ancients`,
      attr,
      attrLabel: ATTR_MAP[attr] || 'Universal',
      attackType: h.attack_type || 'Melee',
      complexity: h.legs === 0 ? 2 : Math.min(3, Math.max(1, ((h.id || 1) % 3) + 1)),
      roles: h.roles || ['Carry', 'Disabler'],
      img: getHeroImage(shortName),
      icon: getHeroIcon(shortName),
      render: getHeroRender(shortName),
      baseStats: {
        hp: (h.base_health || 120) + baseStr * 22,
        mana: (h.base_mana || 75) + baseInt * 12,
        str: baseStr,
        strGain: h.str_gain || 2.4,
        agi: baseAgi,
        agiGain: h.agi_gain || 2.2,
        int: baseInt,
        intGain: h.int_gain || 2.1,
        armor: Number(((h.base_armor || 0) + baseAgi * 0.167).toFixed(1)),
        moveSpeed: h.move_speed || 300,
        attackRange: h.attack_range || 150,
        bat: h.attack_rate || 1.7,
      },
      talents: [
        { level: 25, left: '+25 All Attributes / Signature Mastery', right: '-20% Ultimate Cooldown' },
        { level: 20, left: '+15% Spell Amplification', right: '+40 Attack Speed' },
        { level: 15, left: '+300 Health', right: '+25 Movement Speed' },
        { level: 10, left: '+8 Primary Attribute', right: '+1.75 Mana Regen' },
      ],
      spells: [
        {
          id: `${shortName}_signature`,
          name: `${h.localized_name} Innate & Signature Arts`,
          img: getHeroImage(shortName),
          description: `Harnesses ${ATTR_MAP[attr] || 'Universal'} mastery as a ${h.attack_type || 'Melee'} ${(h.roles || []).join(', ')} combatant in the War of the Ancients.`,
          cooldown: '12s',
          manaCost: '90',
          scepter: 'Upgrades ultimate effectiveness and unlocks new tactical scaling with Aghanim’s Scepter.',
          shard: 'Grants an additional combat sub-ability or utility enhancement via Aghanim’s Shard.',
          notes: 'Cross-linked with standard role itemization and the War of the Ancients lore.',
        },
      ],
      lore: {
        biography:
          loreBio ||
          `${h.localized_name} was drawn into the eternal conflict between Radinthul and Diruulth after the shattering of the Mad Moon, wielding ${(h.roles || ['ancient']).join(' and ')} prowess across the river lands.`,
        origin: 'The Contested Planes of the Ancients',
        personality: 'Battle-hardened champion bound to the Nemestice cycle.',
        relationships: 'Connected to the champions of the Radiant and Dire.',
        voiceLines: [
          `"${h.localized_name} enters the fray!"`,
          '"The Ancients call, and I answer."',
          '"Victory is written in Direstone and Radiant Ore."',
        ],
      },
      recommendedItems:
        attr === 'str'
          ? ['blink', 'black_king_bar', 'overwhelming_blink', 'ultimate_scepter']
          : attr === 'agi'
          ? ['manta', 'swift_blink', 'skadi', 'black_king_bar']
          : ['blink', 'ultimate_scepter', 'sheepstick', 'arcane_blink'],
      relatedHeroes: [
        { id: 'axe', relation: 'Frontline Counterpart', note: 'Often clashes in the river objectives and Roshan pit.' },
        { id: 'invoker', relation: 'Arcane Contemporary', note: 'Shares the battlefield under the shattered Mad Moon.' },
        { id: 'rubick', relation: 'Spell Steal Target', note: 'Rubick covets their signature abilities in teamfights.' },
      ],
      connectedLore: ['lore-mad-moon', 'lore-secret-shop'],
    });
  });

  return result;
}

function mergeItems(rawItems) {
  const curatedById = new Map();
  CURATED_ITEMS.forEach((it) => {
    curatedById.set(it.id, it);
    curatedById.set(it.key, it);
  });

  const result = [...CURATED_ITEMS];
  const existingKeys = new Set(CURATED_ITEMS.map((i) => i.key));

  // Build reverse upgradesTo map from OpenDota rawItems
  const upgradesMap = {};
  Object.entries(rawItems || {}).forEach(([key, item]) => {
    if (key.startsWith('recipe_') || !item.dname) return;
    (item.components || []).forEach((comp) => {
      if (!upgradesMap[comp]) upgradesMap[comp] = new Set();
      upgradesMap[comp].add(key);
    });
  });

  Object.entries(rawItems || {}).forEach(([key, item]) => {
    if (!item || !item.dname || key.startsWith('recipe_')) return;
    if (existingKeys.has(key)) {
      // Enrich upgradesTo if OpenDota has additional upgrades
      const existing = result.find((r) => r.key === key);
      if (existing && upgradesMap[key]) {
        const mergedUpgrades = new Set([...(existing.upgradesTo || []), ...upgradesMap[key]]);
        existing.upgradesTo = Array.from(mergedUpgrades);
      }
      return;
    }

    const isNeutral = item.tier !== undefined && item.tier !== null;
    const category = isNeutral
      ? 'Neutral Items'
      : item.qual === 'consumable'
      ? 'Consumables'
      : (item.components && item.components.length > 0)
      ? 'Upgrades'
      : item.qual === 'secret_shop' || (item.cost || 0) >= 4500
      ? 'Artifacts'
      : 'Basic';

    const stats = (item.attrib || [])
      .filter((a) => a.header || a.footer)
      .slice(0, 5)
      .map((a) => `${a.header || ''} ${Array.isArray(a.value) ? a.value.join('/') : a.value || ''} ${a.footer || ''}`.trim());

    const activeAbility =
      item.abilities && item.abilities.length > 0
        ? {
            name: item.abilities[0].title || 'Item Ability',
            description: item.abilities[0].description || item.hint?.[0] || 'Grants passive and active battlefield bonuses.',
            cooldown: item.cd ? `${item.cd}s` : 'Passive',
            manaCost: item.mc ? `${item.mc}` : '0',
          }
        : item.hint && item.hint.length > 0
        ? {
            name: 'Item Effect',
            description: item.hint.join(' '),
            cooldown: item.cd ? `${item.cd}s` : 'Passive',
            manaCost: item.mc ? `${item.mc}` : '0',
          }
        : null;

    result.push({
      id: key,
      key,
      name: item.dname,
      cost: item.cost || 0,
      category,
      tier: isNeutral ? `Tier ${item.tier}` : null,
      attributes: stats.some((s) => s.toLowerCase().includes('str'))
        ? ['Strength']
        : stats.some((s) => s.toLowerCase().includes('agi'))
        ? ['Agility']
        : stats.some((s) => s.toLowerCase().includes('int') || s.toLowerCase().includes('mana'))
        ? ['Intelligence']
        : ['Utility'],
      img: getItemImage(key),
      stats,
      active: activeAbility,
      lore: item.lore || `Forged by the artisans of the Secret Shop for champions of the Ancients.`,
      tips: item.notes || 'Click any node in the Recipe Tree to inspect components or higher-tier upgrades.',
      whenToBuild: isNeutral
        ? `Available from Neutral Tokens (${ `Tier ${item.tier}` }).`
        : `Situational or core pickup costing ${(item.cost || 0).toLocaleString()} gold.`,
      components: (item.components || []).filter(Boolean),
      upgradesTo: upgradesMap[key] ? Array.from(upgradesMap[key]) : [],
      heroesWhoBuild: ['axe', 'juggernaut', 'invoker', 'rubick'],
      spellInteractions: [],
      connectedLore: ['lore-secret-shop', 'lore-mad-moon'],
    });
  });

  return result;
}


// ==================== src/context/AppContext.jsx ====================

const AppContext = createContext(null);

const FAVORITES_STORAGE_KEY = 'dota2_dark_mylist_v1';
const LANG_STORAGE_KEY = 'dota2_dark_lang_v1';
const THEME_STORAGE_KEY = 'dota2_liquid_theme_v1';

try {
  localStorage.removeItem('cineglass_os_media_v1');
  localStorage.removeItem('cineglass_os_theme_v1');
} catch {}

const ATTR_MY = {
  str: 'ခွန်အား (Strength)',
  agi: 'လျင်မြန်မှု (Agility)',
  int: 'ဉာဏ်ပညာ (Intelligence)',
  all: 'ဘက်စုံ (Universal)',
};

function AppProvider({ children }) {
  const [rawHeroes, setRawHeroes] = useState(CURATED_HEROES);
  const [rawItems, setRawItems] = useState(CURATED_ITEMS);
  const [rawLore] = useState(LORE_ENTRIES);
  const [loading, setLoading] = useState(true);
  const [dataSource, setDataSource] = useState('Loading OpenDota Constants...');
  const [apiError, setApiError] = useState(null);

  const [lang, setLangState] = useState(() => {
    try {
      return localStorage.getItem(LANG_STORAGE_KEY) || 'en';
    } catch {
      return 'en';
    }
  });

  const [theme, setThemeState] = useState(() => {
    try {
      return localStorage.getItem(THEME_STORAGE_KEY) || 'dark';
    } catch {
      return 'dark';
    }
  });

  useEffect(() => {
    const rootEl = document.documentElement;
    if (theme === 'light') {
      rootEl.classList.remove('dark');
      rootEl.classList.add('light');
    } else {
      rootEl.classList.remove('light');
      rootEl.classList.add('dark');
    }
    try {
      localStorage.setItem(THEME_STORAGE_KEY, theme);
    } catch {}
  }, [theme]);

  const toggleTheme = useCallback(() => {
    setThemeState((prev) => (prev === 'dark' ? 'light' : 'dark'));
  }, []);

  const [favorites, setFavorites] = useState(() => {
    try {
      const saved = localStorage.getItem(FAVORITES_STORAGE_KEY);
      return saved
        ? JSON.parse(saved).filter((f) => f.type !== 'lore')
        : [
            { type: 'hero', id: 'invoker' },
            { type: 'item', id: 'blink' },
            { type: 'hero', id: 'juggernaut' },
          ];
    } catch {
      return [];
    }
  });

  const [activeModal, setActiveModal] = useState(null);
  const [quizOpen, setQuizOpen] = useState(false);

  useEffect(() => {
    let mounted = true;
    setLoading(true);
    fetchAndMergeOpenDotaData().then((res) => {
      if (!mounted) return;
      setRawHeroes(res.heroes);
      setRawItems(res.items);
      setDataSource(res.source);
      setApiError(res.error);
      setLoading(false);
    });
    return () => {
      mounted = false;
    };
  }, []);

  const setLang = useCallback((code) => {
    setLangState(code);
    try {
      localStorage.setItem(LANG_STORAGE_KEY, code);
    } catch {}
  }, []);

  const toggleBurmese = useCallback(() => {
    setLang(lang === 'my' ? 'en' : 'my');
  }, [lang, setLang]);

  // Localize Heroes, Items, Lore, and Featured Banners when Burmese ('my') is active
  const heroes = useMemo(() => {
    if (lang !== 'my') return rawHeroes;
    return rawHeroes.map((h) => {
      const myHero = BURMESE_CONTENT.heroes[h.id];
      return {
        ...h,
        attrLabel: ATTR_MY[h.attr] || h.attrLabel,
        title: myHero?.title || `${h.name} — ရှေးဟောင်းကျောက်တိုင်ကြီးများ၏ သူရဲကောင်း`,
        lore: {
          ...h.lore,
          biography:
            myHero?.biography ||
            `${h.name} သည် Mad Moon ပေါက်ကွဲပြီးနောက် Radiant နှင့် Dire တို့၏ ထာဝရစစ်ပွဲကြီးအတွင်းသို့ ဝင်ရောက်လာခဲ့သော ${ATTR_MY[h.attr] || ''} သူရဲကောင်းတစ်ဦးဖြစ်သည်။`,
          origin: myHero?.origin || h.lore?.origin,
          personality: myHero?.personality || h.lore?.personality,
          relationships: myHero?.relationships || h.lore?.relationships,
        },
      };
    });
  }, [rawHeroes, lang]);

  const items = useMemo(() => {
    if (lang !== 'my') return rawItems;
    return rawItems.map((it) => {
      const myItem = BURMESE_CONTENT.items[it.id] || BURMESE_CONTENT.items[it.key];
      return {
        ...it,
        lore:
          myItem?.lore ||
          it.lore ||
          'လျှို့ဝှက်ဆိုင်တော် (Secret Shop) မှ သွန်းလုပ်ထားသော အစွမ်းထက် စစ်ပွဲဝင်ရတနာဖြစ်သည်။',
        tips:
          myItem?.tips ||
          'Recipe Tree မှ ပစ္စည်းတစ်ခုချင်းစီကို နှိပ်၍ ပါဝင်သောပစ္စည်းများနှင့် အဆင့်မြှင့်တင်မှုများကို ကြည့်ရှုနိုင်ပါသည်။',
        whenToBuild: myItem?.whenToBuild || it.whenToBuild,
      };
    });
  }, [rawItems, lang]);

  const lore = useMemo(() => {
    if (lang !== 'my') return rawLore;
    return rawLore.map((l) => {
      const myLore = BURMESE_CONTENT.lore[l.id];
      if (!myLore) return l;
      return {
        ...l,
        title: myLore.title || l.title,
        era: myLore.era || l.era,
        subtitle: myLore.subtitle || l.subtitle,
        summary: myLore.summary || l.summary,
        fullText: myLore.fullText || l.fullText,
      };
    });
  }, [rawLore, lang]);

  const featuredBanners = useMemo(() => {
    if (lang !== 'my') return FEATURED_BANNERS;
    return FEATURED_BANNERS.map((b) => {
      const myB = BURMESE_CONTENT.banners[b.id];
      if (!myB) return b;
      return {
        ...b,
        badge: myB.badge,
        title: myB.title,
        subtitle: myB.subtitle,
        description: myB.description,
        tags: myB.tags,
      };
    });
  }, [lang]);

  const toggleFavorite = useCallback((type, id) => {
    setFavorites((prev) => {
      const exists = prev.some((f) => f.type === type && f.id === id);
      const next = exists
        ? prev.filter((f) => !(f.type === type && f.id === id))
        : [...prev, { type, id }];
      try {
        localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(next));
      } catch {}
      return next;
    });
  }, []);

  const isFavorite = useCallback(
    (type, id) => favorites.some((f) => f.type === type && f.id === id),
    [favorites]
  );

  const getHeroById = useCallback(
    (id) =>
      heroes.find(
        (h) => h.id === id || h.shortName === id || h.npcName === `npc_dota_hero_${id}`
      ),
    [heroes]
  );

  const getItemById = useCallback(
    (id) => items.find((i) => i.id === id || i.key === id),
    [items]
  );

  const getLoreById = useCallback(
    (id) => lore.find((l) => l.id === id),
    [lore]
  );

  const openEntity = useCallback((type, id) => {
    if (!type || !id) return;
    setActiveModal({ type, id });
  }, []);

  const closeModal = useCallback(() => {
    setActiveModal(null);
  }, []);

  const surpriseMe = useCallback(() => {
    const pools = [
      ...CURATED_HEROES.map((h) => ({ type: 'hero', id: h.id })),
      ...CURATED_ITEMS.map((i) => ({ type: 'item', id: i.id })),
    ];
    const randomPick = pools[Math.floor(Math.random() * pools.length)];
    if (randomPick) {
      setActiveModal(randomPick);
    }
  }, []);

  const t = useMemo(() => TRANSLATIONS[lang] || TRANSLATIONS.en, [lang]);

  const value = useMemo(
    () => ({
      heroes,
      items,
      lore,
      mapPois: MAP_POIS,
      relationshipGraph: RELATIONSHIP_GRAPH,
      quizQuestions: QUIZ_QUESTIONS,
      featuredBanners,
      loading,
      dataSource,
      apiError,
      lang,
      setLang,
      toggleBurmese,
      theme,
      toggleTheme,
      t,
      favorites,
      toggleFavorite,
      isFavorite,
      getHeroById,
      getItemById,
      getLoreById,
      activeModal,
      openEntity,
      closeModal,
      quizOpen,
      setQuizOpen,
      surpriseMe,
    }),
    [
      heroes,
      items,
      lore,
      featuredBanners,
      loading,
      dataSource,
      apiError,
      lang,
      setLang,
      toggleBurmese,
      theme,
      toggleTheme,
      t,
      favorites,
      toggleFavorite,
      isFavorite,
      getHeroById,
      getItemById,
      getLoreById,
      activeModal,
      openEntity,
      closeModal,
      quizOpen,
      surpriseMe,
    ]
  );

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  const ctx = useContext(AppContext);
  if (!ctx) throw new Error('useApp must be used inside AppProvider');
  return ctx;
}

function SearchBar() {
  const { heroes, items, lore, openEntity, t } = useApp();
  const [expanded, setExpanded] = useState(false);
  const [query, setQuery] = useState('');
  const inputRef = useRef(null);
  const containerRef = useRef(null);
  const navigate = useNavigate();

  useEffect(() => {
    const onKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setExpanded(true);
        setTimeout(() => inputRef.current?.focus(), 40);
      } else if (e.key === 'Escape') {
        setExpanded(false);
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  useEffect(() => {
    const onClickOutside = (e) => {
      if (containerRef.current && !containerRef.current.contains(e.target)) {
        if (!query) setExpanded(false);
      }
    };
    document.addEventListener('mousedown', onClickOutside);
    return () => document.removeEventListener('mousedown', onClickOutside);
  }, [query]);

  const suggestions = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return { heroes: [], items: [], spells: [], lore: [] };

    const matchedHeroes = heroes
      .filter(
        (h) =>
          h.name.toLowerCase().includes(q) ||
          (h.realName && h.realName.toLowerCase().includes(q)) ||
          (h.roles || []).some((r) => r.toLowerCase().includes(q))
      )
      .slice(0, 4);

    const matchedItems = items
      .filter(
        (i) =>
          i.name.toLowerCase().includes(q) ||
          (i.category && i.category.toLowerCase().includes(q)) ||
          (i.lore && i.lore.toLowerCase().includes(q))
      )
      .slice(0, 4);

    const matchedSpells = [];
    for (const h of heroes) {
      for (const sp of h.spells || []) {
        if (
          sp.name.toLowerCase().includes(q) ||
          (sp.description && sp.description.toLowerCase().includes(q))
        ) {
          matchedSpells.push({ ...sp, heroId: h.id, heroName: h.name });
          if (matchedSpells.length >= 3) break;
        }
      }
      if (matchedSpells.length >= 3) break;
    }

    const matchedLore = lore
      .filter(
        (l) =>
          l.title.toLowerCase().includes(q) ||
          l.summary.toLowerCase().includes(q) ||
          l.category.toLowerCase().includes(q)
      )
      .slice(0, 3);

    return {
      heroes: matchedHeroes,
      items: matchedItems,
      spells: matchedSpells,
      lore: [],
    };
  }, [query, heroes, items]);

  const totalCount =
    suggestions.heroes.length +
    suggestions.items.length +
    suggestions.spells.length +
    suggestions.lore.length;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (query.trim()) {
      navigate(`/search?q=${encodeURIComponent(query.trim())}`);
    }
  };

  return (
    <div ref={containerRef} className="relative flex items-center">
      {expanded ? (
        <form
          onSubmit={handleSubmit}
          className="flex items-center bg-black/90 border border-[#E50914] px-3 py-1.5 rounded-sm w-56 sm:w-72 transition-all duration-200"
        >
          <Search className="w-4 h-4 text-[#E50914] mr-2 shrink-0" />
          <input
            ref={inputRef}
            type="text"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder={t.nav.searchPlaceholder}
            aria-label="Global search across heroes, items, spells and lore"
            className="bg-transparent text-xs sm:text-sm text-white placeholder-[#a3a3a3] focus:outline-none w-full"
          />
          {query && (
            <button
              type="button"
              onClick={() => setQuery('')}
              aria-label="Clear search"
              className="text-[#a3a3a3] hover:text-white ml-1"
            >
              <X className="w-3.5 h-3.5" />
            </button>
          )}
        </form>
      ) : (
        <button
          type="button"
          onClick={() => {
            setExpanded(true);
            setTimeout(() => inputRef.current?.focus(), 40);
          }}
          aria-label="Open global search"
          className="flex items-center gap-1.5 text-white/90 hover:text-[#E50914] p-2 transition-colors"
        >
          <Search className="w-5 h-5" />
          <span className="hidden xl:inline text-xs text-[#a3a3a3] border border-white/15 px-1.5 py-0.5 rounded">
            Ctrl+K
          </span>
        </button>
      )}

      {/* Live Suggestions Dropdown */}
      {expanded && query.trim().length > 0 && (
        <div className="absolute right-0 top-full mt-2 w-80 sm:w-96 bg-[#181818] border border-white/15 rounded-md shadow-2xl overflow-hidden z-50 max-h-[75vh] overflow-y-auto">
          {totalCount === 0 ? (
            <div className="p-4 text-center text-xs text-[#a3a3a3]">
              No matches found for &ldquo;{query}&rdquo;
            </div>
          ) : (
            <div className="divide-y divide-white/10">
              {suggestions.heroes.length > 0 && (
                <div className="p-2.5">
                  <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-[#E50914] px-2 mb-1.5">
                    <Shield className="w-3 h-3" /> Heroes
                  </div>
                  {suggestions.heroes.map((h) => (
                    <button
                      key={h.id}
                      type="button"
                      onClick={() => {
                        openEntity('hero', h.id);
                        setExpanded(false);
                      }}
                      className="w-full flex items-center gap-3 p-1.5 hover:bg-white/10 rounded text-left transition-colors"
                    >
                      <img
                        src={h.img}
                        alt={h.name}
                        loading="lazy"
                        className="w-11 h-6 object-cover rounded border border-white/15 bg-black"
                      />
                      <div className="min-w-0 flex-1">
                        <div className="text-xs font-semibold text-white truncate">{h.name}</div>
                        <div className="text-[10px] text-[#a3a3a3] truncate">
                          {h.attrLabel} • {(h.roles || []).slice(0, 2).join(', ')}
                        </div>
                      </div>
                    </button>
                  ))}
                </div>
              )}

              {suggestions.items.length > 0 && (
                <div className="p-2.5">
                  <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-[#d4af37] px-2 mb-1.5">
                    <Sword className="w-3 h-3" /> Items & Artifacts
                  </div>
                  {suggestions.items.map((it) => (
                    <button
                      key={it.id}
                      type="button"
                      onClick={() => {
                        openEntity('item', it.id);
                        setExpanded(false);
                      }}
                      className="w-full flex items-center gap-3 p-1.5 hover:bg-white/10 rounded text-left transition-colors"
                    >
                      <img
                        src={it.img}
                        alt={it.name}
                        loading="lazy"
                        className="w-9 h-6 object-cover rounded border border-white/15 bg-black"
                      />
                      <div className="min-w-0 flex-1">
                        <div className="text-xs font-semibold text-white truncate">{it.name}</div>
                        <div className="text-[10px] text-[#d4af37] truncate">
                          {it.cost > 0 ? `${it.cost.toLocaleString()}g` : it.tier || 'Special Drop'} • {it.category}
                        </div>
                      </div>
                    </button>
                  ))}
                </div>
              )}

              {suggestions.spells.length > 0 && (
                <div className="p-2.5">
                  <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-sky-400 px-2 mb-1.5">
                    <Zap className="w-3 h-3" /> Spells & Abilities
                  </div>
                  {suggestions.spells.map((sp) => (
                    <button
                      key={sp.id}
                      type="button"
                      onClick={() => {
                        openEntity('hero', sp.heroId);
                        setExpanded(false);
                      }}
                      className="w-full flex items-center gap-3 p-1.5 hover:bg-white/10 rounded text-left transition-colors"
                    >
                      <img
                        src={sp.img}
                        alt={sp.name}
                        loading="lazy"
                        className="w-7 h-7 object-cover rounded border border-white/15 bg-black"
                      />
                      <div className="min-w-0 flex-1">
                        <div className="text-xs font-semibold text-white truncate">{sp.name}</div>
                        <div className="text-[10px] text-[#a3a3a3] truncate">
                          {sp.heroName} • CD: {sp.cooldown}
                        </div>
                      </div>
                    </button>
                  ))}
                </div>
              )}

              {suggestions.lore.length > 0 && (
                <div className="p-2.5">
                  <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-purple-400 px-2 mb-1.5">
                    <BookOpen className="w-3 h-3" /> World Lore & Chronicles
                  </div>
                  {suggestions.lore.map((l) => (
                    <button
                      key={l.id}
                      type="button"
                      onClick={() => {
                        openEntity('lore', l.id);
                        setExpanded(false);
                      }}
                      className="w-full flex items-center gap-3 p-1.5 hover:bg-white/10 rounded text-left transition-colors"
                    >
                      <div className="min-w-0 flex-1">
                        <div className="text-xs font-semibold text-white truncate">{l.title}</div>
                        <div className="text-[10px] text-[#a3a3a3] truncate">
                          {l.era} • {l.category}
                        </div>
                      </div>
                    </button>
                  ))}
                </div>
              )}

              <button
                type="button"
                onClick={() => {
                  navigate(`/search?q=${encodeURIComponent(query.trim())}`);
                  setExpanded(false);
                }}
                className="w-full py-2 text-center text-xs font-semibold text-[#E50914] hover:bg-white/5 transition-colors"
              >
                View all search results for &ldquo;{query}&rdquo; →
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const ATTR_BADGE_COLORS = {
  str: 'bg-red-600/85 text-always-white border-red-400/40',
  agi: 'bg-emerald-600/85 text-always-white border-emerald-400/40',
  int: 'bg-sky-600/85 text-always-white border-sky-400/40',
  all: 'bg-amber-600/85 text-always-white border-amber-400/40',
};

function Card({ entity, type }) {
  const { openEntity, toggleFavorite, isFavorite } = useApp();
  if (!entity) return null;

  const saved = isFavorite(type, entity.id);

  const handleCardClick = () => {
    openEntity(type, entity.id);
  };

  const handleFavoriteClick = (e) => {
    e.stopPropagation();
    toggleFavorite(type, entity.id);
  };

  const title = entity.name || entity.title;
  const subtitle =
    type === 'hero'
      ? `${entity.attrLabel} • ${entity.attackType}`
      : type === 'item'
      ? entity.category
      : `${entity.era} • ${entity.category}`;

  const connectionCount =
    type === 'hero'
      ? (entity.recommendedItems?.length || 0) + (entity.relatedHeroes?.length || 0) + (entity.connectedLore?.length || 0)
      : type === 'item'
      ? (entity.components?.length || 0) + (entity.upgradesTo?.length || 0) + (entity.heroesWhoBuild?.length || 0)
      : (entity.connectedHeroes?.length || 0) + (entity.connectedItems?.length || 0);

  return (
    <div
      role="button"
      tabIndex={0}
      onClick={handleCardClick}
      onKeyDown={(e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleCardClick();
        }
      }}
      aria-label={`View details for ${title}`}
      className="group liquid-card relative shrink-0 w-56 sm:w-64 rounded-2xl overflow-hidden cursor-pointer select-none flex flex-col"
    >
      {/* Top Thumbnail Container */}
      <div className="relative h-32 sm:h-36 w-full bg-black/40 overflow-hidden">
        <img
          src={entity.img}
          alt={title}
          loading="lazy"
          onError={(e) => {
            e.currentTarget.onerror = null;
            e.currentTarget.src =
              'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/invoker.png';
          }}
          className={`w-full h-full ${
            type === 'item'
              ? 'object-contain p-4 bg-gradient-to-b from-slate-900/80 to-black/90'
              : 'object-cover'
          } group-hover:scale-105 transition-transform duration-300`}
        />
        <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-transparent to-black/25" />

        {/* Top-left Attribute / Cost / Era Pill */}
        <div className="absolute top-2.5 left-2.5 flex items-center gap-1.5">
          {type === 'hero' && (
            <span
              className={`text-[10px] font-bold uppercase px-2.5 py-0.5 rounded-full backdrop-blur-md border ${
                ATTR_BADGE_COLORS[entity.attr] || ATTR_BADGE_COLORS.all
              }`}
            >
              {entity.attrLabel}
            </span>
          )}
          {type === 'item' && (
            <span className="flex items-center gap-1 text-[10px] font-bold px-2.5 py-0.5 rounded-full backdrop-blur-md bg-black/75 text-[#fbbf24] border border-[#fbbf24]/40">
              <Coins className="w-3 h-3" />
              {entity.cost > 0 ? `${entity.cost.toLocaleString()}g` : entity.tier || 'Drop'}
            </span>
          )}
          {type === 'lore' && (
            <span className="flex items-center gap-1 text-[10px] font-bold px-2.5 py-0.5 rounded-full backdrop-blur-md bg-[#E50914]/90 text-always-white">
              <Sparkles className="w-3 h-3" />
              {entity.category}
            </span>
          )}
        </div>

        {/* Top-right Quick "My List" Favorite Button */}
        <button
          type="button"
          onClick={handleFavoriteClick}
          aria-label={saved ? `Remove ${title} from My List` : `Add ${title} to My List`}
          className={`absolute top-2.5 right-2.5 w-7 h-7 rounded-full flex items-center justify-center border backdrop-blur-md transition-colors ${
            saved
              ? 'bg-[#E50914] border-[#E50914] text-always-white'
              : 'bg-black/60 border-white/30 text-always-white hover:border-white'
          }`}
        >
          {saved ? <Check className="w-3.5 h-3.5" /> : <Plus className="w-3.5 h-3.5" />}
        </button>
      </div>

      {/* Card Body & Hover Mini Info Panel */}
      <div className="p-3.5 flex-1 flex flex-col justify-between">
        <div>
          <div className="flex items-center justify-between gap-2">
            <h3 className="text-sm font-bold text-white truncate group-hover:text-[#E50914] transition-colors">
              {title}
            </h3>
            {type === 'hero' && (
              <span className="text-[10px] text-[#a3a3a3] shrink-0" title="Complexity">
                {'◆'.repeat(entity.complexity || 1)}
                {'◇'.repeat(3 - (entity.complexity || 1))}
              </span>
            )}
          </div>
          <p className="text-[11px] text-[#a3a3a3] truncate mt-0.5">{subtitle}</p>
        </div>

        {/* Mini Info Panel (Roles / Stats / Connections) */}
        <div className="mt-2.5 pt-2 border-t border-white/10 flex items-center justify-between text-[10px] text-[#a3a3a3]">
          <div className="truncate max-w-[140px]">
            {type === 'hero' && (entity.roles || []).slice(0, 2).join(' • ')}
            {type === 'item' &&
              (entity.stats?.[0] ||
                (entity.upgradesTo?.length
                  ? `Upgrades (${entity.upgradesTo.length})`
                  : entity.category))}
            {type === 'lore' && entity.era}
          </div>
          <span className="flex items-center gap-1 text-[#E50914] font-semibold shrink-0">
            <GitBranch className="w-3 h-3" />
            {connectionCount}
          </span>
        </div>
      </div>
    </div>
  );
}

function Row({ title, subtitle, items = [], type = 'hero', onSeeAll }) {
  const rowRef = useRef(null);
  const { t } = useApp();

  if (!items || items.length === 0) return null;

  const scroll = (direction) => {
    if (!rowRef.current) return;
    const { scrollLeft, clientWidth } = rowRef.current;
    const offset = direction === 'left' ? -clientWidth * 0.75 : clientWidth * 0.75;
    rowRef.current.scrollTo({ left: scrollLeft + offset, behavior: 'smooth' });
  };

  return (
    <section className="relative py-3 sm:py-4 group/row">
      {/* Row Header */}
      <div className="max-w-[1440px] mx-auto px-4 sm:px-8 mb-2.5 flex items-end justify-between">
        <div>
          <div className="flex items-center gap-2.5">
            <span className="w-1.5 h-5 bg-[#E50914] rounded-full inline-block shadow-[0_0_10px_#E50914]" />
            <h2 className="text-base sm:text-xl font-bold text-white tracking-tight">{title}</h2>
            <span className="text-xs text-[#a3a3a3] font-medium">({items.length})</span>
          </div>
          {subtitle && <p className="text-xs text-[#a3a3a3] mt-0.5 ml-4">{subtitle}</p>}
        </div>

        {onSeeAll && (
          <button
            type="button"
            onClick={onSeeAll}
            className="text-xs font-semibold liquid-pill px-3 py-1 rounded-full hover:border-[#E50914] transition-colors"
          >
            {t.rows.exploreAll || 'Explore All →'}
          </button>
        )}
      </div>

      {/* Carousel Container */}
      <div className="relative max-w-[1440px] mx-auto">
        <button
          type="button"
          onClick={() => scroll('left')}
          aria-label={`Scroll ${title} left`}
          className="hidden sm:flex absolute left-1 top-1/2 -translate-y-1/2 z-30 w-10 h-28 items-center justify-center liquid-panel hover:bg-[#E50914] hover:text-always-white text-white rounded-r-xl opacity-0 group-hover/row:opacity-100 transition-all shadow-lg"
        >
          <ChevronLeft className="w-6 h-6" />
        </button>

        <div
          ref={rowRef}
          className="flex items-stretch gap-4 overflow-x-auto no-scrollbar px-4 sm:px-8 py-4"
        >
          {items.map((entry) => (
            <Card key={`${entry.type || type}-${entry.id}`} entity={entry} type={entry.type || type} />
          ))}
        </div>

        <button
          type="button"
          onClick={() => scroll('right')}
          aria-label={`Scroll ${title} right`}
          className="hidden sm:flex absolute right-1 top-1/2 -translate-y-1/2 z-30 w-10 h-28 items-center justify-center liquid-panel hover:bg-[#E50914] hover:text-always-white text-white rounded-l-xl opacity-0 group-hover/row:opacity-100 transition-all shadow-lg"
        >
          <ChevronRight className="w-6 h-6" />
        </button>
      </div>
    </section>
  );
}


// ==================== src/components/RecipeTree.jsx ====================

function RecipeTree({ item, onSelectItem }) {
  const { getItemById, openEntity, t } = useApp();

  if (!item) return null;

  const handleNavigate = (itemKey) => {
    if (!itemKey || itemKey.startsWith('recipe_')) return;
    if (onSelectItem) {
      onSelectItem(itemKey);
    } else {
      openEntity('item', itemKey);
    }
  };

  const componentNodes = (item.components || []).map((compKey) => {
    if (compKey.startsWith('recipe_')) {
      return {
        id: compKey,
        name: 'Recipe Scroll',
        cost: 600,
        img: getItemImage('recipe'),
        isRecipe: true,
      };
    }
    const found = getItemById(compKey);
    return (
      found || {
        id: compKey,
        name: compKey.replace(/_/g, ' '),
        cost: 0,
        img: getItemImage(compKey),
        isRecipe: false,
      }
    );
  });

  const upgradeNodes = (item.upgradesTo || []).map((upKey) => {
    const found = getItemById(upKey);
    return (
      found || {
        id: upKey,
        name: upKey.replace(/_/g, ' '),
        cost: 0,
        img: getItemImage(upKey),
      }
    );
  });

  return (
    <div className="bg-[#141414] border border-white/10 rounded-lg p-5 sm:p-6">
      <div className="flex flex-wrap items-center justify-between gap-2 mb-6">
        <div>
          <h4 className="text-sm sm:text-base font-bold text-white flex items-center gap-2">
            <GitCommit className="w-4 h-4 text-[#E50914]" />
            <span>{t.detail.recipeTree}: {item.name}</span>
          </h4>
          <p className="text-xs text-[#a3a3a3]">
            Click any component or upgrade node to traverse the item build hierarchy.
          </p>
        </div>

        {/* Quick Preset Switcher for Iconic Trees */}
        <div className="flex flex-wrap items-center gap-1.5">
          {['blink', 'ultimate_scepter', 'black_king_bar', 'yasha', 'manta', 'rapier'].map((presetKey) => {
            const p = getItemById(presetKey);
            if (!p) return null;
            return (
              <button
                key={presetKey}
                type="button"
                onClick={() => handleNavigate(presetKey)}
                className={`text-[10px] font-semibold px-2.5 py-1 rounded border transition-colors ${
                  item.key === presetKey
                    ? 'bg-[#E50914] border-[#E50914] text-white'
                    : 'bg-[#1f1f1f] border-white/15 text-[#a3a3a3] hover:text-white'
                }`}
              >
                {p.name}
              </button>
            );
          })}
        </div>
      </div>

      <div className="flex flex-col items-center space-y-4">
        {/* TIER 1: COMPONENTS ("Built From") */}

        <div className="relative bg-gradient-to-b from-[#261415] to-[#1a1a1a] border-2 border-[#E50914] rounded-lg p-4 shadow-xl shadow-[#E50914]/20 min-w-[240px] max-w-sm text-center">
          <span className="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-widest text-[#E50914] mb-1">
            <Sparkles className="w-3 h-3" /> {t.detail.currentItem}

          <div className="flex items-center justify-center gap-3.5 mt-1">

              src={item.img}
              alt={item.name}
              className="w-16 h-12 object-contain rounded bg-black p-1 border border-[#E50914]/50"

            <div className="text-left">
              <div className="text-base font-black text-white">{item.name}</div>
              <div className="text-xs font-bold text-[#d4af37] flex items-center gap-1">
                <Coins className="w-3 h-3" />
                {item.cost > 0 ? `${item.cost.toLocaleString()} Gold` : item.tier || 'Special Drop'}
              </div>
              <div className="text-[10px] text-[#a3a3a3]">{item.category}</div>
            </div>
          </div>
        </div>

        {/* Connector Arrow Down */}
        <div className="flex flex-col items-center text-[#d4af37]">
          <div className="w-0.5 h-5 bg-gradient-to-b from-[#E50914] to-[#d4af37]" />
          <ArrowDown className="w-4 h-4 -mt-1" />
        </div>

        {/* TIER 3: UPGRADES INTO */}
        <div className="w-full">
          <div className="text-center text-[11px] font-bold uppercase tracking-widest text-[#a3a3a3] mb-3">
            {t.detail.upgradesTo} ({upgradeNodes.length})
          </div>

          {upgradeNodes.length === 0 ? (
            <div className="text-center py-2.5 px-4 rounded bg-white/5 border border-dashed border-white/10 text-xs text-[#a3a3a3] max-w-md mx-auto">
              Final Tier Artifact — Does not upgrade into higher items.
            </div>
          ) : (
            <div className="flex flex-wrap items-center justify-center gap-3 sm:gap-4">
              {upgradeNodes.map((up, idx) => (
                <button
                  key={`${up.id}-${idx}`}
                  type="button"
                  onClick={() => handleNavigate(up.id)}
                  className="group flex items-center gap-2.5 p-2.5 rounded-md bg-[#1f1f1f] border border-white/15 hover:border-[#d4af37] hover:scale-105 cursor-pointer transition-all text-left shadow-md"
                >
                  <img
                    src={up.img}
                    alt={up.name}
                    onError={(e) => {
                      e.currentTarget.onerror = null;
                      e.currentTarget.src = getItemImage('blink');
                    }}
                    className="w-11 h-8 object-contain rounded bg-black p-0.5 border border-white/10"
                  />
                  <div>
                    <div className="text-xs font-bold text-white group-hover:text-[#d4af37] capitalize">
                      {up.name}
                    </div>
                    <div className="text-[10px] text-[#d4af37] font-semibold flex items-center gap-1">
                      <Coins className="w-2.5 h-2.5" />
                      {up.cost > 0 ? `${up.cost.toLocaleString()}g` : 'Apex Upgrade'}
                    </div>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function DetailModal() {
  const {
    activeModal,
    closeModal,
    openEntity,
    getHeroById,
    getItemById,
    getLoreById,
    heroes,
    items,
    lore,
    toggleFavorite,
    isFavorite,
    t,
  } = useApp();

  const [activeTab, setActiveTab] = useState('overview');
  const [activeQuoteIndex, setActiveQuoteIndex] = useState(null);

  useEffect(() => {
    setActiveTab('overview');
    setActiveQuoteIndex(null);
  }, [activeModal?.type, activeModal?.id]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key === 'Escape' && activeModal) {
        closeModal();
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [activeModal, closeModal]);

  if (!activeModal) return null;

  const { type, id } = activeModal;
  const entity =
    type === 'hero'
      ? getHeroById(id)
      : type === 'item'
      ? getItemById(id)
      : getLoreById(id);

  if (!entity) return null;

  const saved = isFavorite(type, entity.id);
  const title = entity.name || entity.title;

  // Compute "More Like This"
  const moreLikeThis =
    type === 'hero'
      ? heroes.filter((h) => h.id !== entity.id && h.attr === entity.attr).slice(0, 4)
      : type === 'item'
      ? items.filter((i) => i.id !== entity.id && i.category === entity.category).slice(0, 4)
      : lore.filter((l) => l.id !== entity.id).slice(0, 4);

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-2 sm:p-6 overflow-y-auto"
      onClick={closeModal}
      role="dialog"
      aria-modal="true"
      aria-label={`Details for ${title}`}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        className="nf-modal-animate relative w-full max-w-5xl bg-[#181818] border border-white/15 rounded-xl shadow-2xl overflow-hidden my-auto max-h-[92vh] flex flex-col"
      >
        {/* Close Button */}
        <button
          type="button"
          onClick={closeModal}
          aria-label="Close detail modal"
          className="absolute top-4 right-4 z-30 w-9 h-9 rounded-full bg-black/80 hover:bg-[#E50914] text-white flex items-center justify-center border border-white/20 transition-colors"
        >
          <X className="w-5 h-5" />
        </button>

        {/* Scrollable Content Container */}
        <div className="overflow-y-auto flex-1">
          {/* Top Backdrop Header */}
          <div className="relative h-64 sm:h-80 w-full bg-[#141414] overflow-hidden flex items-end p-6 sm:p-8">
            <img
              src={entity.img}
              alt={title}
              className="absolute inset-0 w-full h-full object-cover opacity-35 blur-[2px] scale-105"
            />
            <div className="absolute inset-0 nf-hero-gradient-left" />
            <div className="absolute inset-0 nf-hero-gradient-bottom" />

            <div className="relative z-10 flex flex-col sm:flex-row sm:items-end justify-between w-full gap-4">
              <div className="flex items-center gap-4 sm:gap-5">
                <img
                  src={entity.img}
                  alt={title}
                  className={`w-24 h-24 sm:w-28 sm:h-28 rounded-lg border-2 border-[#E50914] shadow-xl bg-black ${
                    type === 'item' ? 'object-contain p-2' : 'object-cover'
                  }`}
                />
                <div>
                  <div className="flex flex-wrap items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded bg-[#E50914] text-white">
                      {type === 'hero'
                        ? `${entity.attrLabel} Hero`
                        : type === 'item'
                        ? entity.category
                        : entity.category}
                    </span>
                    {type === 'hero' && (
                      <span className="text-xs text-[#d4af37] font-semibold">
                        {entity.attackType} • Complexity {'◆'.repeat(entity.complexity || 1)}
                      </span>
                    )}
                    {type === 'item' && (
                      <span className="inline-flex items-center gap-1 text-xs font-bold text-[#d4af37]">
                        <Coins className="w-3.5 h-3.5" />
                        {entity.cost > 0 ? `${entity.cost.toLocaleString()} Gold` : entity.tier || 'Special Drop'}
                      </span>
                    )}
                    {type === 'lore' && (
                      <span className="text-xs text-[#d4af37] font-semibold">{entity.era}</span>
                    )}
                  </div>

                  <h2 className="text-2xl sm:text-4xl font-black text-white tracking-tight">
                    {title}
                  </h2>
                  <p className="text-xs sm:text-sm text-[#a3a3a3] mt-0.5">
                    {entity.title || entity.subtitle || (entity.roles || []).join(' • ')}
                  </p>
                </div>
              </div>

              <button

function QuizModal() {
  const { quizOpen, setQuizOpen, quizQuestions, openEntity } = useApp();
  const [currentIndex, setCurrentIndex] = useState(0);
  const [selectedOption, setSelectedOption] = useState(null);
  const [showHint, setShowHint] = useState(false);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);

  if (!quizOpen) return null;

  const currentQ = quizQuestions[currentIndex] || quizQuestions[0];
  const isCorrect = selectedOption === currentQ.answer;

  const handleSelectOption = (opt) => {
    if (selectedOption) return;
    setSelectedOption(opt);
    if (opt === currentQ.answer) {
      setScore((s) => s + 1);
      setStreak((st) => st + 1);
    } else {
      setStreak(0);
    }
  };

  const handleNext = () => {
    setSelectedOption(null);
    setShowHint(false);
    setCurrentIndex((prev) => (prev + 1) % quizQuestions.length);
  };

  const handleReset = () => {
    setSelectedOption(null);
    setShowHint(false);
    setScore(0);
    setStreak(0);
    setCurrentIndex(0);
  };

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4"
      onClick={() => setQuizOpen(false)}
      role="dialog"
      aria-modal="true"
      aria-label="Dota 2 Knowledge Quiz"
    >
      <div
        onClick={(e) => e.stopPropagation()}
        className="nf-modal-animate relative w-full max-w-xl bg-[#181818] border border-white/15 rounded-xl p-6 sm:p-8 shadow-2xl space-y-5"
      >
        <button
          type="button"
          onClick={() => setQuizOpen(false)}
          aria-label="Close quiz"
          className="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/70 hover:bg-[#E50914] text-white flex items-center justify-center"
        >
          <X className="w-4 h-4" />
        </button>

        {/* Header */}
        <div className="flex items-center justify-between pr-8">
          <div className="flex items-center gap-2 text-[#E50914] text-xs font-bold uppercase tracking-widest">
            <HelpCircle className="w-4 h-4" />
            <span>The Shopkeeper&rsquo;s Trial • {currentQ.type}</span>
          </div>
          <div className="flex items-center gap-3 text-xs">
            <span className="px-2.5 py-1 rounded bg-white/10 text-white font-semibold">
              Score: {score}
            </span>
            <span className="px-2.5 py-1 rounded bg-[#E50914]/20 text-[#E50914] border border-[#E50914]/40 font-bold">
              🔥 Streak: {streak}
            </span>
          </div>
        </div>

        {/* Question Card */}
        <div className="bg-[#141414] border border-white/10 rounded-lg p-5 space-y-3">
          <div className="text-[11px] text-[#a3a3a3]">
            Question {currentIndex + 1} of {quizQuestions.length}
          </div>
          <p className="text-sm sm:text-base font-bold text-white leading-relaxed">
            &ldquo;{currentQ.clue}&rdquo;
          </p>

          {showHint ? (
            <p className="text-xs text-[#d4af37] bg-amber-950/30 border border-[#d4af37]/30 p-2.5 rounded">
              💡 Hint: {currentQ.hint}
            </p>
          ) : (
            <button
              type="button"
              onClick={() => setShowHint(true)}
              className="text-xs font-semibold text-[#d4af37] hover:underline"
            >
              Need a hint from the Archive?
            </button>
          )}
        </div>

        {/* Options */}
        <div className="grid grid-cols-1 gap-2.5">
          {currentQ.options.map((opt) => {
            let btnStyle = 'bg-[#1f1f1f] hover:bg-white/10 border-white/15 text-white';
            if (selectedOption) {
              if (opt === currentQ.answer) {
                btnStyle = 'bg-emerald-900/60 border-emerald-400 text-white font-bold';
              } else if (opt === selectedOption) {
                btnStyle = 'bg-red-900/60 border-red-400 text-white';
              } else {
                btnStyle = 'bg-[#141414] border-white/5 text-[#a3a3a3] opacity-60';
              }
            }

            return (
              <button
                key={opt}
                type="button"
                disabled={Boolean(selectedOption)}
                onClick={() => handleSelectOption(opt)}
                className={`p-3.5 rounded-lg border text-left text-xs sm:text-sm transition-all ${btnStyle}`}
              >
                {opt}
              </button>
            );
          })}
        </div>

        {/* Result & Next Actions */}
        {selectedOption && (
          <div className="pt-2 border-t border-white/10 flex flex-wrap items-center justify-between gap-3">
            <div className="text-xs font-bold">
              {isCorrect ? (
                <span className="text-emerald-400 flex items-center gap-1">
                  <Award className="w-4 h-4" /> Correct! The Ancients recognize your wisdom.
                </span>
              ) : (
                <span className="text-red-400">
                  Incorrect — Answer: <strong>{currentQ.answer}</strong>
                </span>
              )}
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => {
                  setQuizOpen(false);
                  openEntity(currentQ.entityType, currentQ.entityId);
                }}
                className="text-xs font-semibold px-3 py-2 rounded bg-white/10 hover:bg-white/20 text-[#d4af37]"
              >
                Inspect Entry
              </button>
              <button
                type="button"
                onClick={handleNext}
                className="flex items-center gap-1.5 text-xs font-bold px-4 py-2 rounded bg-[#E50914] hover:bg-[#f40612] text-white"
              >
                <span>Next Question</span>
                <ArrowRight className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>
        )}

        <div className="flex justify-end">
          <button
            type="button"
            onClick={handleReset}
            className="inline-flex items-center gap-1 text-[11px] text-[#a3a3a3] hover:text-white"
          >
            <RotateCcw className="w-3 h-3" /> Reset Score
          </button>
        </div>
      </div>
    </div>
  );
}

const CATEGORIES = [
  'All',
  'Basic',
  'Upgrades',
  'Artifacts',
  'Neutral Items',
  'Roshan Drops',
  'Consumables',
];

const PRICE_RANGES = [
  { id: 'all', label: 'All Prices' },
  { id: 'free', label: '0g (Roshan / Neutral Drops)' },
  { id: 'under1500', label: 'Under 1,500g' },
  { id: '1500to4000', label: '1,500g – 4,000g' },
  { id: 'over4000', label: '4,000g+ Luxury' },
];

const ATTRIBUTES = ['All', 'Strength', 'Agility', 'Intelligence', 'Damage', 'Mobility'];

function ItemsPage() {
  const { items, getItemById, t } = useApp();
  const [searchParams] = useSearchParams();

  const [category, setCategory] = useState(searchParams.get('cat') || 'All');
  const [priceRange, setPriceRange] = useState('all');
  const [attribute, setAttribute] = useState('All');
  const [heroFilter, setHeroFilter] = useState('All');
  const [searchQuery, setSearchQuery] = useState('');
  const [treeItemKey, setTreeItemKey] = useState('blink');

  const treeItem = getItemById(treeItemKey) || getItemById('blink') || items[0];

  const filteredItems = useMemo(() => {
    return items.filter((it) => {
      if (category !== 'All' && it.category !== category) return false;

      if (priceRange === 'free' && it.cost > 0) return false;
      if (priceRange === 'under1500' && (it.cost === 0 || it.cost >= 1500)) return false;
      if (priceRange === '1500to4000' && (it.cost < 1500 || it.cost > 4000)) return false;
      if (priceRange === 'over4000' && it.cost <= 4000) return false;

      if (
        attribute !== 'All' &&
        !(it.attributes || []).some((a) => a.toLowerCase() === attribute.toLowerCase()) &&
        !(it.stats || []).some((s) => s.toLowerCase().includes(attribute.toLowerCase()))
      ) {
        return false;
      }

      if (heroFilter !== 'All' && !(it.heroesWhoBuild || []).includes(heroFilter)) {

        !(it.lore || '').toLowerCase().includes(searchQuery.trim().toLowerCase())
      ) {
        return false;
      }

      return true;
    });
  }, [items, category, priceRange, attribute, heroFilter, searchQuery]);

function SearchPage() {
  const { heroes, items, lore, openEntity } = useApp();
  const [searchParams, setSearchParams] = useSearchParams();
  const [query, setQuery] = useState(searchParams.get('q') || '');

  useEffect(() => {
    const qParam = searchParams.get('q');
    if (qParam !== null && qParam !== query) {
      setQuery(qParam);
    }
  }, [searchParams]);

  const handleInputChange = (e) => {
    const val = e.target.value;
    setQuery(val);
    setSearchParams(val ? { q: val } : {});
  };

  const results = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) {
      return {
        heroes: heroes.slice(0, 8),
        items: items.slice(0, 8),
        spells: [],
        lore: lore.slice(0, 6),
      };
    }

    const matchedHeroes = heroes.filter(
      (h) =>
        h.name.toLowerCase().includes(q) ||
        (h.realName && h.realName.toLowerCase().includes(q)) ||
        (h.roles || []).some((r) => r.toLowerCase().includes(q)) ||
        (h.lore?.biography && h.lore.biography.toLowerCase().includes(q))
    );

    const matchedItems = items.filter(
      (i) =>
        i.name.toLowerCase().includes(q) ||
        (i.category && i.category.toLowerCase().includes(q)) ||
        (i.lore && i.lore.toLowerCase().includes(q))
    );

    const matchedSpells = [];
    heroes.forEach((h) => {
      (h.spells || []).forEach((sp) => {
        if (
          sp.name.toLowerCase().includes(q) ||
          (sp.description && sp.description.toLowerCase().includes(q))
        ) {
          matchedSpells.push({ ...sp, heroId: h.id, heroName: h.name });
        }
      });
    });

    const matchedLore = lore.filter(
      (l) =>
        l.title.toLowerCase().includes(q) ||
        l.summary.toLowerCase().includes(q) ||
        l.category.toLowerCase().includes(q)
    );

    return {
      heroes: matchedHeroes,
      items: matchedItems,
      spells: matchedSpells,
      lore: [],
    };
  }, [query, heroes, items]);

  return (
    <div className="min-h-screen liquid-page pt-24 pb-16">
      <div className="max-w-[1440px] mx-auto px-4 sm:px-8 space-y-8">
        {/* Search Input Header */}
        <div className="liquid-panel rounded-2xl p-6 space-y-4">
          <h1 className="text-2xl sm:text-3xl font-black text-white">
            Global Dota 2 Archive Search
          </h1>
          <div className="relative">
            <Search className="w-5 h-5 text-[#E50914] absolute left-4 top-1/2 -translate-y-1/2" />
            <input
              type="text"
              value={query}
              onChange={handleInputChange}
              placeholder="Search across all 124+ Heroes, 200+ Items, Spells, Talents, Factions & Lore..."
              className="w-full liquid-input rounded-xl pl-12 pr-4 py-3.5 text-sm sm:text-base text-white placeholder-[#737373] focus:outline-none"
            />
          </div>
          <div className="flex flex-wrap gap-2 text-xs text-[#a3a3a3]">
            <span>Popular searches:</span>
            {['Blink', 'Invoker', 'Aghanim', 'Roshan', 'Skadi', 'Omnislash', 'Mad Moon'].map(
              (term) => (
                <button
                  key={term}
                  type="button"
                  onClick={() => {
                    setQuery(term);
                    setSearchParams({ q: term });
                  }}
                  className="px-2.5 py-0.5 rounded-full liquid-pill hover:bg-[#E50914] text-white transition-colors"
                >
                  {term}
                </button>
              )
            )}
          </div>
        </div>

        {/* Heroes Results */}
        {results.heroes.length > 0 && (
          <div className="space-y-3">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <Shield className="w-4 h-4 text-[#E50914]" />
              <span>Heroes ({results.heroes.length})</span>
            </h2>
            <div className="flex flex-wrap gap-4">
              {results.heroes.slice(0, 16).map((h) => (
                <Card key={h.id} entity={h} type="hero" />
              ))}
            </div>
          </div>
        )}

        {/* Items Results */}
        {results.items.length > 0 && (
          <div className="space-y-3">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <Sword className="w-4 h-4 text-[#d4af37]" />
              <span>Items & Artifacts ({results.items.length})</span>
            </h2>
            <div className="flex flex-wrap gap-4">
              {results.items.slice(0, 16).map((it) => (
                <Card key={it.id} entity={it} type="item" />
              ))}
            </div>
          </div>
        )}

        {/* Spells Results */}
        {results.spells.length > 0 && (
          <div className="space-y-3">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <Zap className="w-4 h-4 text-sky-400" />
              <span>Matching Spells & Abilities ({results.spells.length})</span>
            </h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {results.spells.map((sp) => (
                <button
                  key={sp.id}
                  type="button"
                  onClick={() => openEntity('hero', sp.heroId)}
                  className="flex items-start gap-3 p-3.5 rounded-lg bg-[#181818] hover:bg-[#1f1f1f] border border-white/10 hover:border-sky-400 text-left transition-all"
                >
                  <img
                    src={sp.img}
                    alt={sp.name}
                    className="w-12 h-12 rounded border border-white/15 bg-black shrink-0"
                  />
                  <div>
                    <div className="text-sm font-bold text-white">{sp.name}</div>
                    <div className="text-[11px] text-sky-400 font-semibold">
                      {sp.heroName} • CD: {sp.cooldown}
                    </div>
                    <p className="text-xs text-[#a3a3a3] line-clamp-2 mt-1">
                      {sp.description}
                    </p>
                  </div>
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function MyListPage() {
  const { favorites, getHeroById, getItemById, surpriseMe, t } = useApp();

  const savedEntities = useMemo(() => {
    return favorites
      .map((f) => {
        if (f.type === 'hero') {
          const h = getHeroById(f.id);
          return h ? { entity: h, type: 'hero' } : null;
        }
        if (f.type === 'item') {
          const i = getItemById(f.id);
          return i ? { entity: i, type: 'item' } : null;
        }
        return null;
      })
      .filter(Boolean);
  }, [favorites, getHeroById, getItemById]);

  return (
    <div className="min-h-screen liquid-page pt-24 pb-16">
      <div className="max-w-[1440px] mx-auto px-4 sm:px-8 space-y-8">
        <div className="liquid-panel rounded-2xl p-6 flex flex-wrap items-end justify-between gap-4">
          <div>
            <div className="text-xs font-bold uppercase tracking-[0.2em] text-[#E50914] flex items-center gap-1.5">
              <Bookmark className="w-3.5 h-3.5" /> PERSONAL ARCHIVE
            </div>
            <h1 className="text-3xl sm:text-4xl font-black text-white mt-1">
              {t.rows.myList} ({savedEntities.length})
            </h1>
            <p className="text-xs sm:text-sm text-[#a3a3a3] mt-1">
              Saved locally in your browser via localStorage. Click the + / ✓ button on any card to manage your list.
            </p>
          </div>

          <button
            type="button"
            onClick={surpriseMe}
            className="inline-flex items-center gap-2 bg-[#E50914] hover:bg-[#f40612] text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg shadow-[#E50914]/30"
          >
            <Shuffle className="w-4 h-4" />
            <span>{t.nav.surpriseMe}</span>
          </button>
        </div>

        {savedEntities.length === 0 ? (
          <div className="liquid-panel rounded-2xl p-12 text-center space-y-3">
            <p className="text-base font-bold text-white">Your List is currently empty</p>
            <p className="text-xs text-[#a3a3a3]">
              Click the + icon on any Hero, Item, or Lore card across the encyclopedia to bookmark it here.
            </p>
          </div>
        ) : (
          <div className="flex flex-wrap gap-4">
            {savedEntities.map(({ entity, type }) => (
              <Card key={`${type}-${entity.id}`} entity={entity} type={type} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
